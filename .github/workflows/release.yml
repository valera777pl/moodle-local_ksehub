# A tag v* (e.g. v1.0.0) makes a GitHub release with local_ksehub.zip, ready for
# Site administration → Plugins → Install plugins, and its SHA-256 checksum.
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  zip:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the plugin into a folder named ksehub
        uses: actions/checkout@v4
        with:
          path: ksehub

      - name: Zip it the way Moodle installs it (root folder ksehub)
        run: |
          zip -r local_ksehub.zip ksehub -x 'ksehub/.git/*' 'ksehub/.github/*'
          sha256sum local_ksehub.zip > local_ksehub.zip.sha256
          cat local_ksehub.zip.sha256

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" local_ksehub.zip local_ksehub.zip.sha256 \
            --repo "$GITHUB_REPOSITORY" --title "local_ksehub $GITHUB_REF_NAME" \
            --notes "Moodle plugin built by GitHub Actions from tag $GITHUB_REF_NAME. SHA-256: $(cut -d' ' -f1 local_ksehub.zip.sha256)"
